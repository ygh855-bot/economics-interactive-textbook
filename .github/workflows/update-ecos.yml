name: Refresh BOK ECOS official time series
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - 'scripts/update_ecos.py'
      - '.github/workflows/update-ecos.yml'
permissions:
  contents: write
concurrency:
  group: kh-ecos-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get official BOK observations
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python scripts/update_ecos.py
      - name: Commit open statistical data
        run: |
          git config user.name "kh-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ecos/series.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public BOK ECOS observations"
            git push
          else
            echo "No data change"
          fi
